version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_work_os_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_work_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: ai_work_os_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: ai_work_os_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_work_os
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5
      - MOCK_LLM_FALLBACK=true
    depends_on:
      - postgres
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ai_work_os_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_storage:
